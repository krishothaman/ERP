<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Enter Marks')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Enter Marks')}"></header>
        <div class="content" style="max-width: 1100px;">

            <a class="small text-decoration-none" th:href="@{/faculty}"><i class="bi bi-arrow-left"></i> My courses</a>
            <div class="page-head mt-2">
                <div>
                    <h2 class="page-title"><span class="mono fs-5 align-middle me-2" th:text="${course.code}"></span><span th:text="${course.name}"></span></h2>
                    <p class="page-sub">IA-1 and IA-2 are out of 50, SEM out of 100. Total = internals (40%) + SEM (60%). Leave a box empty if that exam is not done yet.</p>
                </div>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/faculty/marks}" method="post">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <div class="panel">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead><tr><th>Roll No</th><th>Name</th>
                                <th style="width: 120px;">IA-1 <span class="text-muted fw-normal">/ 50</span></th>
                                <th style="width: 120px;">IA-2 <span class="text-muted fw-normal">/ 50</span></th>
                                <th style="width: 120px;">SEM <span class="text-muted fw-normal">/ 100</span></th>
                                <th class="num">Total <span class="text-muted fw-normal">/ 100</span></th>
                                <th class="text-center">Grade</th></tr></thead>
                            <tbody>
                            <tr th:each="s : ${students}">
                                <td class="mono" th:text="${s.rollNo}"></td>
                                <td th:text="${s.name}"></td>
                                <td>
                                    <input class="form-control form-control-sm mark-input" type="number" min="0" max="50" data-exam="ia1"
                                           th:name="'ia1_' + ${s.id}" th:value="${marks[s.id]?.ia1()}" th:aria-label="'IA-1 marks for ' + ${s.name}">
                                </td>
                                <td>
                                    <input class="form-control form-control-sm mark-input" type="number" min="0" max="50" data-exam="ia2"
                                           th:name="'ia2_' + ${s.id}" th:value="${marks[s.id]?.ia2()}" th:aria-label="'IA-2 marks for ' + ${s.name}">
                                </td>
                                <td>
                                    <input class="form-control form-control-sm mark-input" type="number" min="0" max="100" data-exam="sem"
                                           th:name="'sem_' + ${s.id}" th:value="${marks[s.id]?.sem()}" th:aria-label="'SEM marks for ' + ${s.name}">
                                </td>
                                <td class="num fw-semibold" data-total>-</td>
                                <td class="text-center" data-grade>-</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="7" class="empty">No students in this department and year.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" type="submit" th:disabled="${#lists.isEmpty(students)}">
                    <i class="bi bi-save me-1"></i>Save marks</button>
            </form>

        </div>
    </main>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script>
    // Live total and grade per row; same formula as GradeUtil.total on the server
    function grade(t) {
        return t >= 90 ? 'O' : t >= 80 ? 'A+' : t >= 70 ? 'A' : t >= 60 ? 'B+' : t >= 50 ? 'B' : t >= 40 ? 'C' : 'F';
    }
    function update(row) {
        const v = exam => row.querySelector('[data-exam="' + exam + '"]').value;
        const [ia1, ia2, sem] = ['ia1', 'ia2', 'sem'].map(v);
        const done = ia1 !== '' && ia2 !== '' && sem !== '';
        const total = done ? Math.floor((4 * (+ia1 + +ia2) + 6 * +sem + 5) / 10) : null;
        row.querySelector('[data-total]').textContent = done ? total : '-';
        const g = row.querySelector('[data-grade]');
        g.innerHTML = done ? '<span class="grade' + (total < 40 ? ' grade-f' : '') + '">' + grade(total) + '</span>' : '-';
    }
    document.querySelectorAll('tbody tr').forEach(row => {
        if (!row.querySelector('.mark-input')) return;
        update(row);
        row.addEventListener('input', () => update(row));
    });
</script>
</body>
</html>
