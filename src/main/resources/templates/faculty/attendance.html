<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mark Attendance')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Mark Attendance')}"></header>
        <div class="content" style="max-width: 980px;">

            <a class="small text-decoration-none" th:href="@{/faculty}"><i class="bi bi-arrow-left"></i> My courses</a>
            <div class="page-head mt-2">
                <div>
                    <h2 class="page-title"><span class="mono fs-5 align-middle me-2" th:text="${course.code}"></span><span th:text="${course.name}"></span></h2>
                    <p class="page-sub" th:text="${course.department} + ' · Year ' + ${course.year}"></p>
                </div>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <!-- Pick a date: reloads the page with that day's attendance -->
            <form class="panel panel-body d-flex flex-wrap gap-3 align-items-end mb-3" th:action="@{/faculty/attendance}" method="get">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <div>
                    <label class="form-label" for="pickDate">Class date</label>
                    <input class="form-control" type="date" id="pickDate" name="date" th:value="${date}">
                </div>
                <button class="btn btn-outline" type="submit">Load</button>
                <span class="ms-auto pill" th:classappend="${alreadyTaken} ? 'pill-ok' : 'pill-mute'"
                      th:text="${alreadyTaken} ? 'Already taken - editing' : 'Not taken yet'"></span>
            </form>

            <form th:action="@{/faculty/attendance}" method="post">
                <input type="hidden" name="courseId" th:value="${course.id}">
                <input type="hidden" name="date" th:value="${date}">
                <div class="panel">
                    <div class="panel-head">
                        <div class="d-flex align-items-center gap-2">
                            <label class="form-label mb-0" for="hours">Session length</label>
                            <select class="form-select form-select-sm w-auto" id="hours" name="hours">
                                <option th:each="h : ${#numbers.sequence(1, 3)}" th:value="${h}"
                                        th:text="${h} + (${h} == 1 ? ' hour' : ' hours')" th:selected="${h == hours}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-ghost" type="button" data-mark="PRESENT">All present</button>
                            <button class="btn btn-sm btn-ghost" type="button" data-mark="ABSENT">All absent</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead><tr><th>Roll No</th><th>Name</th><th class="text-end">Status</th></tr></thead>
                            <tbody>
                            <tr th:each="s : ${students}"
                                th:with="st=${statuses[s.id] != null ? statuses[s.id].name() : 'PRESENT'}">
                                <td class="mono" th:text="${s.rollNo}"></td>
                                <td th:text="${s.name}"></td>
                                <td class="text-end">
                                    <div class="seg" role="radiogroup" th:aria-label="'Status for ' + ${s.name}">
                                        <input type="radio" th:id="'p' + ${s.id}" th:name="'s_' + ${s.id}" value="PRESENT" th:checked="${st == 'PRESENT'}">
                                        <label class="seg-p" th:for="'p' + ${s.id}">Present</label>
                                        <input type="radio" th:id="'a' + ${s.id}" th:name="'s_' + ${s.id}" value="ABSENT" th:checked="${st == 'ABSENT'}">
                                        <label class="seg-a" th:for="'a' + ${s.id}">Absent</label>
                                        <input type="radio" th:id="'o' + ${s.id}" th:name="'s_' + ${s.id}" value="OD" th:checked="${st == 'OD'}">
                                        <label class="seg-od" th:for="'o' + ${s.id}">OD/ML</label>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="3" class="empty">No students in this department and year.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <button class="btn btn-primary mt-3" type="submit" th:disabled="${#lists.isEmpty(students)}">
                    <i class="bi bi-check2-circle me-1"></i>Save attendance</button>
            </form>

        </div>
    </main>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
<script>
    document.querySelectorAll('[data-mark]').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('input[type=radio][value="' + btn.dataset.mark + '"]').forEach(r => r.checked = true);
    }));
</script>
</body>
</html>
