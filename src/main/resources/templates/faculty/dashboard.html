<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('My Courses')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <h1 class="h4 page-title">Welcome, <span th:text="${faculty.name}">Faculty</span></h1>
    <p class="text-muted" th:text="${faculty.department} + ' Department'"></p>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="c : ${courses}">
            <div class="card h-100 p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="badge text-bg-primary" th:text="${c.code}"></span>
                    <span class="small text-muted" th:text="${c.credits} + ' credits'"></span>
                </div>
                <h2 class="h6 fw-semibold" th:text="${c.name}"></h2>
                <p class="small text-muted mb-3">
                    <span th:text="${c.department} + ' / Year ' + ${c.year}"></span> &middot;
                    <span th:text="${studentCounts[c.id]} + ' students'"></span>
                </p>
                <div class="mt-auto d-flex gap-2">
                    <a class="btn btn-sm btn-primary" th:href="@{/faculty/attendance(courseId=${c.id})}">
                        <i class="bi bi-calendar-check me-1"></i>Attendance</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/faculty/marks(courseId=${c.id})}">
                        <i class="bi bi-pencil-square me-1"></i>Marks</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(courses)}">
            <div class="card p-4 text-center text-muted">No courses are assigned to you yet. Ask the admin to assign one.</div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
