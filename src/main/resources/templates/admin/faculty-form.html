<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${faculty.id} == null ? 'Add Faculty' : 'Edit Faculty')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container" style="max-width: 560px;">
    <div class="card p-4">
        <h1 class="h5 mb-3" th:text="${faculty.id} == null ? 'Add faculty' : 'Edit faculty'">Faculty</h1>

        <form th:action="@{/admin/faculty/save}" th:object="${faculty}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label" for="name">Full name</label>
                <input class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="department">Department</label>
                <input class="form-control" th:field="*{department}" list="departments"
                       th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{department}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" th:field="*{email}" type="email" th:readonly="${faculty.id != null}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
                <div class="form-text" th:if="${faculty.id == null}">Also used as the username and first password.</div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/faculty}">Cancel</a>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments :: departments}"></th:block>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
