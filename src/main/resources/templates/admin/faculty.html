<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Faculty')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h1 class="h4 page-title">Faculty</h1>
        <a class="btn btn-primary" th:href="@{/admin/faculty/new}"><i class="bi bi-plus-lg me-1"></i>Add faculty</a>
    </div>

    <div th:if="${msg}" class="alert alert-success py-2" th:text="${msg}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Name</th><th>Department</th><th>Email (login)</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="f : ${facultyList}">
                    <td class="fw-semibold" th:text="${f.name}"></td>
                    <td th:text="${f.department}"></td>
                    <td th:text="${f.email}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/faculty/{id}/edit(id=${f.id})}"><i class="bi bi-pencil"></i></a>
                        <form class="d-inline" th:action="@{/admin/faculty/{id}/delete(id=${f.id})}" method="post"
                              onsubmit="return confirm('Delete this faculty member? Their courses will become unassigned.');">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(facultyList)}"><td colspan="4" class="text-center text-muted py-4">No faculty yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
