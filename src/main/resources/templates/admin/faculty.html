<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Faculty')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Faculty')}"></header>
        <div class="content">

            <div class="page-head">
                <div>
                    <h2 class="page-title">Faculty</h2>
                    <p class="page-sub" th:text="${#lists.size(facultyList)} + ' member(s)'"></p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/faculty/new}"><i class="bi bi-plus-lg me-1"></i>Add faculty</a>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead><tr><th>Name</th><th>Department</th><th>Email (login)</th><th class="text-end">Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="f : ${facultyList}">
                            <td class="fw-semibold text-dark" th:text="${f.name}"></td>
                            <td><span class="pill pill-tag" th:text="${f.department}"></span></td>
                            <td class="mono" th:text="${f.email}"></td>
                            <td class="text-end text-nowrap">
                                <a class="btn-icon" th:href="@{/admin/faculty/{id}/edit(id=${f.id})}" title="Edit"
                                   th:aria-label="'Edit ' + ${f.name}"><i class="bi bi-pencil"></i></a>
                                <form class="d-inline" th:action="@{/admin/faculty/{id}/delete(id=${f.id})}" method="post"
                                      onsubmit="return confirm('Delete this faculty member? Their courses will become unassigned.');">
                                    <button class="btn-icon danger" type="submit" title="Delete" th:aria-label="'Delete ' + ${f.name}">
                                        <i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(facultyList)}"><td colspan="4" class="empty">No faculty yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
