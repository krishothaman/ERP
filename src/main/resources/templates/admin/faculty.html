<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Faculty')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Faculty')}"></header>
        <div class="content">

            <div class="page-head">
                <div>
                    <h2 class="page-title">Faculty</h2>
                    <p class="page-sub" th:text="${#lists.size(facultyList)} + ' member(s)'"></p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/faculty/new}"><i class="bi bi-plus-lg me-1"></i>Add faculty</a>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead><tr><th>Name</th><th>Department</th><th>Email (login)</th><th class="text-end">Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="f : ${facultyList}">
                            <td class="fw-semibold text-dark" th:text="${f.name}"></td>
                            <td><span class="pill pill-tag" th:text="${f.department}"></span></td>
                            <td class="mono" th:text="${f.email}"></td>
                            <td class="text-end text-nowrap">
                                <a class="btn-icon" th:href="@{/admin/faculty/{id}/edit(id=${f.id})}" title="Edit"
                                   th:aria-label="'Edit ' + ${f.name}"><i class="bi bi-pencil"></i></a>
                                <form th:id="'deleteForm-' + ${f.id}" class="d-inline" th:action="@{/admin/faculty/{id}/delete(id=${f.id})}" method="post">
                                    <button class="btn-icon danger" type="button" title="Delete" th:aria-label="'Delete ' + ${f.name}"
                                            th:data-target-name="${f.name}"
                                            th:data-form-id="'deleteForm-' + ${f.id}"
                                            onclick="showDeleteModal(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(facultyList)}"><td colspan="4" class="empty">No faculty yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true" style="background-color: rgba(0,0,0,0.45);">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: var(--radius-md); border: 1px solid var(--hairline); box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold" id="deleteModalLabel">Confirm Deletion</h5>
                <button type="button" class="btn-close" onclick="closeDeleteModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <p class="mb-2">Are you sure you want to delete <strong id="deleteTargetName">this faculty member</strong>?</p>
                <p class="text-muted small mb-0">Their assigned courses will become unassigned.</p>
            </div>
            <div class="modal-footer border-top-0 pt-0">
                <button type="button" class="btn btn-light" onclick="closeDeleteModal()">Cancel</button>
                <button type="button" class="btn btn-danger" onclick="submitDelete()">Delete Faculty</button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
<script>
    let activeDeleteFormId = null;
    let bsModalInstance = null;

    function showDeleteModal(btn) {
        const targetName = btn.getAttribute('data-target-name') || 'this faculty member';
        activeDeleteFormId = btn.getAttribute('data-form-id');
        document.getElementById('deleteTargetName').textContent = targetName;

        const modalEl = document.getElementById('deleteModal');
        if (window.bootstrap && window.bootstrap.Modal) {
            if (!bsModalInstance) {
                bsModalInstance = new bootstrap.Modal(modalEl);
            }
            bsModalInstance.show();
        } else {
            modalEl.classList.add('show');
            modalEl.style.display = 'block';
        }
    }

    function closeDeleteModal() {
        const modalEl = document.getElementById('deleteModal');
        if (bsModalInstance) {
            bsModalInstance.hide();
        }
        modalEl.classList.remove('show');
        modalEl.style.display = 'none';
        activeDeleteFormId = null;
    }

    function submitDelete() {
        if (activeDeleteFormId) {
            const form = document.getElementById(activeDeleteFormId);
            if (form) form.submit();
        }
    }
</script>
</body>
</html>
