<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Courses')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Courses')}"></header>
        <div class="content">

            <div class="page-head">
                <div>
                    <h2 class="page-title">Courses</h2>
                    <p class="page-sub" th:text="${#lists.size(courses)} + ' course(s)'"></p>
                </div>
                <a class="btn btn-primary" th:href="@{/admin/courses/new}"><i class="bi bi-plus-lg me-1"></i>Add course</a>
            </div>

            <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

            <div class="panel">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead><tr><th>Code</th><th>Name</th><th>Department</th><th>Year</th><th class="num">Credits</th><th>Faculty</th><th class="text-end">Actions</th></tr></thead>
                        <tbody>
                        <tr th:each="c : ${courses}">
                            <td class="mono" th:text="${c.code}"></td>
                            <td class="fw-semibold text-dark" th:text="${c.name}"></td>
                            <td><span class="pill pill-tag" th:text="${c.department}"></span></td>
                            <td th:text="${c.year}"></td>
                            <td class="num" th:text="${c.credits}"></td>
                            <td>
                                <span th:if="${c.faculty}" th:text="${c.faculty.name}"></span>
                                <span th:unless="${c.faculty}" class="pill pill-mute">Unassigned</span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a class="btn-icon" th:href="@{/admin/courses/{id}/edit(id=${c.id})}" title="Edit"
                                   th:aria-label="'Edit ' + ${c.code}"><i class="bi bi-pencil"></i></a>
                                <form class="d-inline" th:action="@{/admin/courses/{id}/delete(id=${c.id})}" method="post"
                                      onsubmit="return confirm('Delete this course and all its attendance and marks?');">
                                    <button class="btn-icon danger" type="submit" title="Delete" th:aria-label="'Delete ' + ${c.code}">
                                        <i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(courses)}"><td colspan="7" class="empty">No courses yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
