<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Change Password')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container" style="max-width: 480px;">
    <div class="card p-4">
        <h1 class="h5 mb-3"><i class="bi bi-key me-2"></i>Change password</h1>

        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

        <form th:action="@{/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label" for="currentPassword">Current password</label>
                <input class="form-control" type="password" id="currentPassword" name="currentPassword" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="newPassword">New password</label>
                <input class="form-control" type="password" id="newPassword" name="newPassword" required minlength="4">
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button class="btn btn-primary" type="submit">Update password</button>
        </form>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
