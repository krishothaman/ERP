<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | College ERP'">College ERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Top navigation bar; links depend on the logged-in user's role -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}"><i class="bi bi-mortarboard-fill me-2"></i>College ERP</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <th:block sec:authorize="hasRole('ADMIN')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/students}">Students</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/faculty}">Faculty</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/admin/courses}">Courses</a></li>
                </th:block>
                <th:block sec:authorize="hasRole('FACULTY')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/faculty}">My Courses</a></li>
                </th:block>
                <th:block sec:authorize="hasRole('STUDENT')">
                    <li class="nav-item"><a class="nav-link" th:href="@{/student}">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/student/attendance}">Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/student/marks}">Marks</a></li>
                </th:block>
            </ul>
            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:href="@{/change-password}"><i class="bi bi-key me-2"></i>Change password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
