<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Dashboard')}"></head>
<body>
<div class="app">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <main class="main">
        <header th:replace="~{layout :: topbar('Dashboard')}"></header>
        <div class="content" style="max-width: 820px;">

            <div class="page-head">
                <div>
                    <h2 class="page-title">Welcome back, <span th:text="${#strings.arraySplit(student.name, ' ')[0]}">Student</span></h2>
                    <p class="page-sub">Your student details for this academic year.</p>
                </div>
            </div>

            <div class="alert alert-danger d-flex gap-2 align-items-center" th:if="${totals.low()}">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Your overall attendance is below 75%. <a th:href="@{/student/attendance}">See attendance details</a>.</span>
            </div>

            <!-- Student ID card -->
            <div class="panel id-card"
                 th:with="years=${ {'I', 'II', 'III', 'IV', 'V'} },
                          yearLabel=${student.year >= 1 and student.year <= 5 ? years[student.year - 1] : student.year}">
                <div class="id-card-head">
                    <span><i class="bi bi-mortarboard-fill me-2"></i><span th:text="${appName}">College ERP Portal</span></span>
                    <span class="id-card-tag">Student</span>
                </div>
                <div class="id-card-body">
                    <div class="id-photo" role="img" th:aria-label="'Photo of ' + ${student.name}">
                        <i class="bi bi-person-fill"></i>
                        <span>Photo</span>
                    </div>
                    <dl class="id-details">
                        <dt>Name</dt>
                        <dd class="id-name" th:text="${student.name}">Student</dd>
                        <dt>Register number</dt>
                        <dd class="mono" th:text="${student.rollNo}"></dd>
                        <dt>Department</dt>
                        <dd th:text="${student.department}"></dd>
                        <dt>Year of study</dt>
                        <dd th:text="${yearLabel} + ' Year'"></dd>
                        <dt>Academic year</dt>
                        <dd th:text="${academicYear}"></dd>
                    </dl>
                </div>
            </div>

        </div>
    </main>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
