spring.application.name=college-erp
server.port=${PORT:8080}

# MySQL - connection details with environment variable overrides for production/Railway
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/college_erp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}

# Hibernate creates/updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}

# Portal name shown in the sidebar, login page and page titles
app.name=College ERP Portal
# Shown on the login page, sidebar and student dashboard (keep this file ASCII; Spring reads it as Latin-1)
app.academic-year=2026-27
